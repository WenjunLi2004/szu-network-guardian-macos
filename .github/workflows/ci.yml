name: macOS CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test-and-build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s Tests -v
      - run: xcrun swiftc -parse-as-library -typecheck Sources/MenuBarApp.swift
      - run: ./scripts/build.sh
